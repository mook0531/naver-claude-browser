<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>네이버 + Claude 브라우저</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="browser">
    <div id="toolbar">
      <button id="back" title="뒤로">◀</button>
      <button id="forward" title="앞으로">▶</button>
      <button id="reload" title="새로고침">⟳</button>
      <button id="home" title="네이버 홈">N</button>
      <input id="url" type="text" spellcheck="false" placeholder="주소 또는 네이버 검색어">
    </div>
    <webview id="view" src="https://www.naver.com" allowpopups></webview>
  </div>

  <div id="panel">
    <div id="panel-head">
      <strong>Claude</strong>
      <span>
        <select id="model" title="모델 선택">
          <option value="claude-haiku-5-5">Haiku 5.5 · 가장 저렴</option>
          <option value="claude-sonnet-5-5">Sonnet 5.5 · 균형</option>
          <option value="claude-opus-5-5">Opus 5.5 · 고성능</option>
        </select>
        <button id="clear" title="대화 지우기">새 대화</button>
        <button id="settings" title="API 키 설정">⚙</button>
      </span>
    </div>
    <div id="key-box" hidden>
      <input id="key" type="password" placeholder="Anthropic API 키 (sk-ant-...)">
      <button id="save-key">저장</button>
    </div>
    <div id="chat"></div>
    <div id="composer">
      <div id="quick">
        <button data-q="이 페이지 내용을 핵심만 요약해 줘.">요약</button>
        <button data-q="이 페이지의 주요 정보를 표로 정리해 줘.">표로 정리</button>
        <button data-q="이 페이지에서 중요한 링크/항목을 목록으로 뽑아 줘.">항목 추출</button>
      </div>
      <label><input type="checkbox" id="attach" checked> 현재 페이지 내용 첨부 (텍스트를 선택하면 선택 부분만)</label>
      <textarea id="question" rows="3" placeholder="질문을 입력하세요 (Ctrl+Enter 전송)"></textarea>
      <div id="actions">
        <span id="status"></span>
        <button id="stop" hidden>중단</button>
        <button id="send">Claude에게 보내기</button>
      </div>
    </div>
  </div>
<script src="renderer.js"></script>
</body>
</html>
